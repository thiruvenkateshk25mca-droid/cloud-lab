<!DOCTYPE html>
<html>
<head>
  <title>Student Details</title>
  <style>
    body {
      font-family: Arial;
      background: lightgray;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .card {
      background: white;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
      text-align: center;
    }

    img {
      width: 100px;
      border-radius: 50%;
    }

    p {
      text-align: left;
    }

    button {
      padding: 10px;
      background: blue;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="https://via.placeholder.com/100" alt="Student">

    <h2>Student Details</h2>

    <p><b>Name:</b> John Doe</p>
    <p><b>Roll No:</b> 1023</p>
    <p><b>Department:</b> CSE</p>
    <p><b>Year:</b> 3rd Year</p>

    <button>View Profile</button>
  </div>

</body>
</html>
